# SonarQube Cloud, CI-based analysis (#772). Automatic Analysis is off for this project.
sonar.organization=cfaysal
sonar.projectKey=cfaysal_kherep
sonar.projectName=kherep

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.mts,**/*.test.ts,**/*.test.js,**/*-test.mts,**/test/**
