# SonarQube Cloud, CI-based analysis (#772). Automatic Analysis is off for this project.
sonar.organization=cfcon-ch
sonar.projectKey=CFcon-CH_kherep
sonar.projectName=kherep

sonar.sources=.
sonar.tests=.
# Test support files (*-fixture.mts, *.fixture.mts, fixtures/) are tests, not source (#917).
sonar.test.inclusions=**/*.test.mts,**/*.test.ts,**/*.test.js,**/*-test.mts,**/test/**,**/*-fixture.mts,**/*.fixture.mts,**/fixtures/**
# Vendored plugin sources mirrored for Codex parity; not maintained here.
sonar.exclusions=codex/parity/plugin-sources/**,**/node_modules/**,**/*.test.mts,**/*.test.ts,**/*.test.js,**/*-test.mts,**/test/**,**/*-fixture.mts,**/*.fixture.mts,**/fixtures/**
sonar.test.exclusions=codex/parity/plugin-sources/**,**/node_modules/**
# Copies that are identical by design, each pinned by a test (#917):
# - the hook runtime's recovery writer equals claude/hooks/lib/ byte for byte, because the
#   runtime must not import from hooks/ (bootstrap/hook-runtime-delivery.test.mts);
# - the Claude Confluence broker equals the Codex one except for its credential variable,
#   each a standalone entry point (bootstrap/atl-jira-broker-contract.test.mts).
sonar.cpd.exclusions=claude/kherep/hook-runtime/recovery/restore-write.mts,claude/kherep/hook-runtime/recovery/workspace-scope.mts,modules/atl-jira-brokers/atl-confluence-ccoder.mts
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/node/lcov.info,coverage/worker/lcov.info
