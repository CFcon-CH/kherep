name: Sonar

on:
  workflow_call:
    inputs:
      coverage-artifact:
        required: true
        type: string
      coverage-attempt:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # Called only after CI validates coverage. Fork PRs skip the caller.
  # The resulting SonarCloud check is required on main.
  sonar:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # Identity outputs survive a scanner-only rerun; see .github/coverage.md.
      - name: Check accepted artifact name and assembly attempt
        env:
          COVERAGE_ARTIFACT: ${{ inputs.coverage-artifact }}
          COVERAGE_ATTEMPT: ${{ inputs.coverage-attempt }}
        run: |
          node --input-type=module -e 'const a=process.env.COVERAGE_ATTEMPT; if (!/^[1-9][0-9]*$/.test(a) || BigInt(a)>BigInt(process.env.GITHUB_RUN_ATTEMPT) || process.env.COVERAGE_ARTIFACT!=="sonar-coverage-"+process.env.GITHUB_RUN_ID+"-"+a) process.exit(1);'
      - name: Download this run's accepted coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.coverage-artifact }}
          path: coverage
      - name: Verify coverage identity and reports before using the secret
        env:
          COVERAGE_ARTIFACT: ${{ inputs.coverage-artifact }}
          COVERAGE_ATTEMPT: ${{ inputs.coverage-attempt }}
        run: >-
          node bootstrap/coverage-report.mts verify
          --run-id "${{ github.run_id }}" --attempt "$COVERAGE_ATTEMPT"
          --consumer-attempt "${{ github.run_attempt }}" --artifact-name "$COVERAGE_ARTIFACT"
          --checkout-sha "$(git rev-parse HEAD)"
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
