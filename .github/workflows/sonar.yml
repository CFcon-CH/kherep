name: Sonar

on:
  workflow_call:
    inputs:
      coverage-artifact:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # Called only after CI validates coverage. Fork PRs skip the caller.
  # The resulting SonarCloud check is required on main.
  sonar:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Download this run's accepted coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.coverage-artifact }}
          path: coverage
      - name: Verify coverage identity and reports before using the secret
        run: >-
          node bootstrap/coverage-report.mts verify
          --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"
          --checkout-sha "$(git rev-parse HEAD)"
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
