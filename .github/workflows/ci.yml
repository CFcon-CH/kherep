name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run. A running main
# run is not cancelled, but GitHub keeps one pending run per group, so in a burst
# of merges a newer push replaces a pending one and that commit gets no result.
# Pick an install or release target from a main commit whose run finished (#823).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ubuntu jobs run on ubuntu-26.04 explicitly (#670). Matrix keys stay ubuntu-latest because the
  # protect-main ruleset requires check names such as "unit (ubuntu-latest)"; runs-on maps the key.
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-26.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Capability source contract (mac profile)
        run: node bootstrap/capability-check.mts --strict --profile mac
      - name: Capability source contract (win profile)
        run: node bootstrap/capability-check.mts --strict --profile win
      - name: Manifest consistency
        run: node --test bootstrap/manifest-consistency.test.mts

  # Issue #506. Runs the versioned commit-msg hook over every commit of a pull
  # request, so a commit made with `git commit --no-verify` is still rejected.
  # No `name:` and no matrix: the check context is exactly `commit-policy`, the
  # name a ruleset can require. The `if` limits it to pull requests, where the
  # base and head SHAs exist; on push and workflow_dispatch it is skipped.
  # fetch-depth: 0 because the default shallow checkout lacks the range; the
  # script fails closed (exit 2) on a shallow repository. The SHAs pass through
  # env, never interpolated into the script.
  commit-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    env:
      KHEREP_WORK_ITEM_REQUIRED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Commit messages of every pull request commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node bootstrap/pr-commit-policy.mts "$BASE_SHA" "$HEAD_SHA"

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-26.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Audit legacy template blobs once with full public history (#728).
          fetch-depth: ${{ matrix.os == 'ubuntu-latest' && '0' || '1' }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Hook test suites
        shell: bash
        run: |
          ${{ matrix.os == 'ubuntu-latest' && format('export NODE_V8_COVERAGE="{0}/kherep-coverage/unit/raw"', runner.temp) || '' }}
          status=0
          for t in claude/hooks/*.test.js claude/hooks/*.test.mts claude/hooks/lib/*.test.js claude/hooks/lib/*.test.mts; do
            [ -e "$t" ] || continue
            echo "== $t"
            node "$t" || status=1
          done
          exit $status
      - name: Bootstrap suites (TypeScript on Node, no build)
        run: ${{ matrix.os == 'ubuntu-latest' && format('NODE_V8_COVERAGE="{0}/kherep-coverage/unit/raw" npm run test:bootstrap', runner.temp) || 'npm run test:bootstrap' }}
      - name: Install dependencies for native Control Plane tests
        if: runner.os == 'macOS'
        run: npm ci --ignore-scripts
      - name: Fetch pinned public legacy reader
        if: runner.os == 'macOS'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin f34b66fa581be6b5bdd5f1d84262b6d64a80a150
          git cat-file -e f34b66fa581be6b5bdd5f1d84262b6d64a80a150^{commit}
      - name: Control Plane protocol and node suites (macOS)
        if: runner.os == 'macOS'
        run: npm run test:control-plane
      - name: Coverage manifest (unit)
        if: always() && !cancelled() && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          TEST_OUTCOME: ${{ job.status }}
        run: >-
          node bootstrap/coverage-report.mts manifest --producer unit
          --artifact "${{ runner.temp }}/kherep-coverage/unit"
          --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"
          --checkout-sha "$(git rev-parse HEAD)" --test-outcome "$TEST_OUTCOME"
      - name: Upload coverage (unit)
        if: always() && !cancelled() && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kherep-coverage/unit
          if-no-files-found: error
          retention-days: 2

  # Windows runs the same suites as `unit`, split across runners: the bootstrap
  # install tests drive install.sh under Git Bash at 80-330 s each (issue #424).
  # The shard map and its completeness guard are bootstrap/ci-shard.mts and
  # bootstrap/ci-shard.test.mts. The codex shard runs the whole
  # `npm run test:codex` file set (issue #534); it is not a bootstrap shard.
  unit-windows:
    strategy:
      fail-fast: false
      matrix:
        suite: [hooks, control-plane, install-preview-safety, project-rules-install, commit-policy-install, drift-check-optional-tools, control-plane-hook-install, control-plane-stable-install, bootstrap-rest, codex]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Hook test suites
        if: matrix.suite == 'hooks'
        shell: bash
        run: |
          status=0
          for t in claude/hooks/*.test.js claude/hooks/*.test.mts claude/hooks/lib/*.test.js claude/hooks/lib/*.test.mts; do
            [ -e "$t" ] || continue
            echo "== $t"
            node "$t" || status=1
          done
          exit $status
      - name: Windows ACL decision against real descriptors (Windows PowerShell)
        if: matrix.suite == 'hooks'
        timeout-minutes: 10
        shell: bash
        run: node --test modules/github-broker/windows-access.test.mts
      - name: Install dependencies for native Control Plane tests
        if: matrix.suite == 'control-plane'
        run: npm ci --ignore-scripts
      - name: Fetch pinned public legacy reader
        if: matrix.suite == 'control-plane'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin f34b66fa581be6b5bdd5f1d84262b6d64a80a150
          git cat-file -e f34b66fa581be6b5bdd5f1d84262b6d64a80a150^{commit}
      - name: Control Plane protocol and node suites (Windows)
        if: matrix.suite == 'control-plane'
        # Bound simultaneous native process/PowerShell fixtures on the hosted runner (PR #155).
        run: node --test --test-concurrency=1 "modules/control-plane/*.test.mts" "modules/control-plane/node/*.test.mts"
      - name: Codex projection suites and run guard (Windows, issues #534 and #550)
        if: matrix.suite == 'codex'
        # The whole test:codex file set, as on ubuntu (typescript, unit-engines-floor)
        # and on the Windows host (issue #534), started by the run guard (issue #550):
        # it reads the patterns from the test:codex script, runs them with a spec
        # and a TAP reporter, and fails the step when a pattern selects no file,
        # the test count falls below its floor or the skipped tests differ from
        # the list in codex/scripts/codex-run-expected.json. No npm ci: nothing
        # under codex/ imports a package. Default node --test concurrency, as on
        # ubuntu; the step timeout turns a hang (the #535 lock-holder class) into
        # a failure instead of the 360-minute job default. Green runs take 36-39
        # minutes on windows-latest, so 40 minutes failed a run that did not hang.
        timeout-minutes: 60
        run: node codex/scripts/codex-run-guard.mts run --platform win32 --tap "${{ runner.temp }}/codex-run.tap"
      - name: Bootstrap shard (TypeScript on Node, no build)
        if: matrix.suite != 'hooks' && matrix.suite != 'control-plane' && matrix.suite != 'codex'
        run: node bootstrap/ci-shard.mts run ${{ matrix.suite }}

  # The ruleset requires the check "unit (windows-latest)"; this job carries that
  # name and fails unless every unit-windows shard succeeded, the codex shard
  # included, so that check now also covers the Codex suites on Windows
  # (issue #534). `if: always()` is
  # load-bearing: without it the gate is skipped when a shard fails, and a job
  # skipped that way does not block the merge (GitHub docs, "Handling skipped
  # but required checks").
  unit-windows-gate:
    name: unit (windows-latest)
    needs: unit-windows
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Every Windows shard succeeded
        run: |
          echo "unit-windows result: ${{ needs.unit-windows.result }}"
          test "${{ needs.unit-windows.result }}" = "success"

  # The unit suites and the node suites of the typescript job (without the type
  # check) on releases the engines field in package.json admits besides the
  # current LTS. Support is not monotonic by version: 22.18.0 is the floor and
  # has import.meta.main, while the later 24.1.0 lacks it and runs the
  # TypeScript sources through unflagged type stripping.
  unit-engines-floor:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.18.0", "24.1.0"]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Hook test suites
        shell: bash
        run: |
          status=0
          for t in claude/hooks/*.test.js claude/hooks/*.test.mts claude/hooks/lib/*.test.js claude/hooks/lib/*.test.mts; do
            [ -e "$t" ] || continue
            echo "== $t"
            node "$t" || status=1
          done
          exit $status
      - name: Bootstrap suites (TypeScript on Node, no build)
        run: npm run test:bootstrap
      - run: npm ci --ignore-scripts
      - name: Codex projection suites and run guard (issue #550)
        run: node codex/scripts/codex-run-guard.mts run --platform linux --tap "${{ runner.temp }}/codex-run.tap"
      - name: local-inference and mcp-auth-bridge suites
        run: npm run test:modules
      - name: atl-jira broker suites
        run: npm run test:brokers
      - name: Fetch pinned public legacy reader
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin f34b66fa581be6b5bdd5f1d84262b6d64a80a150
          git cat-file -e f34b66fa581be6b5bdd5f1d84262b6d64a80a150^{commit}
      - name: Control Plane protocol and node suites
        run: npm run test:control-plane

  smoke:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-26.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # install-transaction.test.sh (run by the smoke test) drives install.sh,
      # which writes core.hooksPath with `git config --global`, and with
      # `--system` only on KHEREP_INSTALL_SYSTEM_HOOKSPATH=1. The test redirects
      # both scopes to its own throwaway files; this redirect is a second layer,
      # and the last step shows what, if anything, landed here.
      - name: Bootstrap smoke test
        env:
          KHEREP_SMOKE_NO_MANAGED_WORKSPACE: "1"
          GIT_CONFIG_SYSTEM: ${{ runner.temp }}/gitconfig-system
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-global
        run: bash bootstrap/smoke-test.sh
      - name: Isolated git config written by the smoke test
        if: always()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP/gitconfig-system" "$RUNNER_TEMP/gitconfig-global"; do
            echo "== $f"; cat "$f" 2>/dev/null || echo "(not written)"
          done
          echo "== runner system core.hooksPath: $(git config --system --get core.hooksPath || echo unset)"

  typescript:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type check (tsc --noEmit, strict, erasableSyntaxOnly)
        run: npm run typecheck
      - name: Codex projection suites and run guard (issue #550)
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/kherep-coverage/typescript/raw
        run: node codex/scripts/codex-run-guard.mts run --platform linux --tap "${{ runner.temp }}/codex-run.tap"
      - name: local-inference and mcp-auth-bridge suites
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/kherep-coverage/typescript/raw
        run: npm run test:modules
      - name: atl-jira broker suites
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/kherep-coverage/typescript/raw
        run: npm run test:brokers
      - name: Fetch pinned public legacy reader
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin f34b66fa581be6b5bdd5f1d84262b6d64a80a150
          git cat-file -e f34b66fa581be6b5bdd5f1d84262b6d64a80a150^{commit}
      - name: Control Plane protocol and node suites
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/kherep-coverage/typescript/raw
        run: npm run test:control-plane
      - name: Coverage fixtures with installed c8
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/kherep-coverage/typescript/raw
        run: node --test bootstrap/coverage-report.test.mts bootstrap/coverage-copies.test.mts bootstrap/coverage-erased-types.test.mts
      - name: Coverage manifest (typescript)
        if: always() && !cancelled()
        continue-on-error: true
        env:
          TEST_OUTCOME: ${{ job.status }}
        run: >-
          node bootstrap/coverage-report.mts manifest --producer typescript
          --artifact "${{ runner.temp }}/kherep-coverage/typescript"
          --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"
          --checkout-sha "$(git rev-parse HEAD)" --test-outcome "$TEST_OUTCOME"
      - name: Upload coverage (typescript)
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-typescript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kherep-coverage/typescript
          if-no-files-found: error
          retention-days: 2

  control-plane-worker:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: modules/control-plane/worker
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci --ignore-scripts --include=optional
      - name: Type check
        run: npm run typecheck
      - name: Worker tests (vitest, workerd)
        run: npm test -- --coverage
      - name: Bundle check (wrangler deploy --dry-run, no credentials)
        run: npm run check:bundle
      - name: Coverage manifest (worker)
        if: always() && !cancelled()
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          TEST_OUTCOME: ${{ job.status }}
        run: >-
          node bootstrap/coverage-report.mts manifest --producer worker
          --artifact "${{ runner.temp }}/kherep-coverage/worker" --input modules/control-plane/worker/coverage/lcov.info
          --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"
          --checkout-sha "$(git rev-parse HEAD)" --test-outcome "$TEST_OUTCOME"
      - name: Upload coverage (worker)
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kherep-coverage/worker
          if-no-files-found: error
          retention-days: 2

  client-binding-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-26.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install root TypeScript dependencies
        run: npm ci --ignore-scripts
      - name: Install probe dependencies
        working-directory: modules/control-plane/client-binding-probe
        run: npm ci --ignore-scripts
      - name: Type check client binding probe
        working-directory: modules/control-plane/client-binding-probe
        run: npm run typecheck
      - name: Test client binding probe
        working-directory: modules/control-plane/client-binding-probe
        run: ${{ matrix.os == 'ubuntu-latest' && format('NODE_V8_COVERAGE="{0}/kherep-coverage/probe/raw" npm test', runner.temp) || 'npm test' }}
      - name: Coverage manifest (probe)
        if: always() && !cancelled() && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          TEST_OUTCOME: ${{ job.status }}
        run: >-
          node bootstrap/coverage-report.mts manifest --producer probe
          --artifact "${{ runner.temp }}/kherep-coverage/probe"
          --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"
          --checkout-sha "$(git rev-parse HEAD)" --test-outcome "$TEST_OUTCOME"
      - name: Upload coverage (probe)
        if: always() && !cancelled() && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kherep-coverage/probe
          if-no-files-found: error
          retention-days: 2

  coverage-report:
    needs: [unit, typescript, control-plane-worker, client-binding-probe]
    if: always() && !cancelled()
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download coverage (unit)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-inputs/unit
      - name: Download coverage (typescript)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-typescript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-inputs/typescript
      - name: Download coverage (probe)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-inputs/probe
      - name: Download coverage (worker)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-inputs/worker
      - name: Require successful contributing jobs
        if: always() && !cancelled()
        env:
          UNIT: ${{ needs.unit.result }}
          TYPESCRIPT: ${{ needs.typescript.result }}
          WORKER: ${{ needs.control-plane-worker.result }}
          PROBE: ${{ needs.client-binding-probe.result }}
        run: |
          printf 'Coverage producers: unit=%s typescript=%s worker=%s probe=%s\n' "$UNIT" "$TYPESCRIPT" "$WORKER" "$PROBE" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$UNIT" = success && test "$TYPESCRIPT" = success && test "$WORKER" = success && test "$PROBE" = success
      - name: Assemble and validate real coverage
        run: >-
          npm run coverage:report -- assemble
          --artifacts "${{ runner.temp }}/coverage-inputs" --source-root "$GITHUB_WORKSPACE"
          --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"
          --checkout-sha "$(git rev-parse HEAD)"
      - name: Upload accepted Sonar coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage
          if-no-files-found: error
          retention-days: 2
      - name: Fork pull request scan policy
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Fork pull request: coverage validated; secret-bearing Sonar scan skipped. Sonar is not required yet.' >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage failure summary
        if: failure()
        run: echo 'Coverage validation failed. No partial report is accepted for Sonar.' >> "$GITHUB_STEP_SUMMARY"

  sonar:
    needs: coverage-report
    if: needs.coverage-report.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/sonar.yml
    with:
      coverage-artifact: sonar-coverage-${{ github.run_id }}-${{ github.run_attempt }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
